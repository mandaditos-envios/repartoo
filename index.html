<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coach Pro</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #131b2e;
            --primary: #4f46e5;
            --accent: #10b981;
            --text: #f1f5f9;
            --sub: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; color: #fff; }
        p.subtitle { font-size: 0.8rem; color: var(--sub); }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: #a5b4fc; }

        input, textarea, select {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            color: #fff; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 10px;
            outline: none;
        }

        button {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .workout-log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .log-item { background: var(--bg); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; display: flex; justify-content: space-between; }

        #ai-response {
            display: none; background: #064e3b; border: 1px solid var(--accent);
            padding: 12px; border-radius: 8px; font-size: 0.85rem; line-height: 1.5; margin-top: 10px; white-space: pre-wrap;
        }
    </style>

    <!-- Carga del SDK oficial de Google Gen AI en el navegador -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@0.1.1"
        }
      }
    </script>
</head>
<body>

    <header>
        <h1>🏋️ AI COACH PRO</h1>
        <p class="subtitle">Entrenador personal inteligente basado en sobrecarga progresiva</p>
    </header>

    <!-- Configuración Key -->
    <div class="card">
        <div class="card-title">🔑 Configuración de IA</div>
        <input type="password" id="api-key" placeholder="Pega tu API Key de Gemini aquí">
        <button onclick="saveKey()">Guardar API Key</button>
    </div>

    <!-- Registro de Ejercicio -->
    <div class="card">
        <div class="card-title">📝 Anotar Serie</div>
        <select id="muscle">
            <option value="Pecho">Pecho</option>
            <option value="Espalda">Espalda</option>
            <option value="Hombros">Hombros</option>
            <option value="Piernas">Piernas</option>
            <option value="Brazos">Brazos</option>
        </select>
        <input type="text" id="exercise" placeholder="Ejercicio (ej. Press Plano)">
        <div style="display: flex; gap: 8px;">
            <input type="number" id="reps" placeholder="Reps">
            <input type="number" id="weight" placeholder="Kg">
        </div>
        <button onclick="addLog()">+ Añadir Serie</button>
    </div>

    <!-- Historial del Día -->
    <div class="card">
        <div class="card-title">📊 Entrenamiento de Hoy</div>
        <div id="logs-container" class="workout-log">
            <span style="font-size: 0.8rem; color: var(--sub);">No hay series registradas aún.</span>
        </div>
    </div>

    <!-- Analizador IA -->
    <div class="card" style="border-color: var(--primary);">
        <div class="card-title">🤖 Entrenador IA</div>
        <button id="ai-btn" onclick="consultAI()">✨ Analizar mi Entrenamiento con IA</button>
        <div id="ai-response"></div>
    </div>

    <script type="module">
        import { GoogleGenAI } from '@google/genai';

        let logs = [];

        window.saveKey = function() {
            const key = document.getElementById('api-key').value.trim();
            if (key) {
                localStorage.setItem('coach_gemini_key', key);
                alert('¡API Key guardada correctamente!');
            }
        };

        window.addLog = function() {
            const muscle = document.getElementById('muscle').value;
            const exercise = document.getElementById('exercise').value || 'Ejercicio';
            const reps = document.getElementById('reps').value;
            const weight = document.getElementById('weight').value || 0;

            if (!reps) return alert('Ingresa las repeticiones.');

            logs.push({ muscle, exercise, reps, weight, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            
            document.getElementById('reps').value = '';
            document.getElementById('weight').value = '';
            
            renderLogs();
        };

        function renderLogs() {
            const container = document.getElementById('logs-container');
            if (logs.length === 0) {
                container.innerHTML = `<span style="font-size: 0.8rem; color: var(--sub);">No hay series registradas aún.</span>`;
                return;
            }

            container.innerHTML = logs.map(l => `
                <div class="log-item">
                    <span><strong>${l.muscle} - ${l.exercise}</strong></span>
                    <span>${l.reps} reps @ ${l.weight} kg</span>
                </div>
            `).join('');
        }

        window.consultAI = async function() {
            const apiKey = localStorage.getItem('coach_gemini_key') || document.getElementById('api-key').value.trim();
            
            if (!apiKey) {
                alert('Ingresa y guarda tu API Key primero.');
                return;
            }

            const aiBtn = document.getElementById('ai-btn');
            const resBox = document.getElementById('ai-response');
            
            aiBtn.disabled = true;
            aiBtn.innerText = 'Analizando con IA...';
            resBox.style.display = 'block';
            resBox.innerText = 'Consultando al entrenador IA...';

            try {
                // Inicialización oficial usando el SDK
                const ai = new GoogleGenAI({ apiKey: apiKey });

                const prompt = `Actúa como un entrenador personal experto. Analiza la siguiente sesión de entrenamiento de mi usuario e indícale:
1. Evaluación rápida del rendimiento.
2. Un consejo directo de sobrecarga progresiva para su próxima sesión (subir peso o reps).
3. Feedback breve y motivador en 3 oraciones.

Datos del entrenamiento:
${logs.length > 0 ? JSON.stringify(logs, null, 2) : 'Aún no hay series guardadas hoy, da un consejo general para empezar.'}`;

                // Se utiliza gemini-2.5-flash como estándar recomendado para tareas rápidas de texto
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: prompt,
                });

                resBox.innerText = response.text;
            } catch (error) {
                resBox.innerText = '❌ Error al conectar con la IA:\n' + (error.message || error);
            } finally {
                aiBtn.disabled = false;
                aiBtn.innerText = '✨ Analizar mi Entrenamiento con IA';
            }
        };

        // Cargar key guardada previamente
        const savedKey = localStorage.getItem('coach_gemini_key');
        if (savedKey) {
            document.getElementById('api-key').value = savedKey;
        }
    </script>
</body>
</html>
