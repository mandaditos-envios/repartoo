<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Track Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151c2c;
            --primary: #6366f1;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #26334d;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background-color: var(--bg);
            color: var(--text);
        }

        body {
            padding: 12px;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
        }

        .status-badge {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Card resumen */
        .summary-card {
            background: linear-gradient(135deg, #1e1b4b, var(--surface));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .summary-header span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .summary-counter {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Selector Días */
        .day-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .day-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 4px;
            font-weight: 700;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .day-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Contenedor de Tarjetas */
        .muscle-cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .muscle-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            width: 100%;
        }

        .muscle-card.completed {
            border-color: var(--accent);
            background: linear-gradient(180deg, var(--surface), rgba(16, 185, 129, 0.05));
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .muscle-title {
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .target-info {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .remaining-badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #a5b4fc;
            text-align: right;
            white-space: nowrap;
        }

        .remaining-badge.done {
            color: var(--accent);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .accordion-trigger {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            width: 100%;
        }

        .accordion-content {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .accordion-content.open {
            display: flex;
        }

        /* Formulario */
        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            background: var(--bg);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .select-ex, .input-custom-ex {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
        }

        .input-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }

        .input-fields input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
        }

        .btn-add-set {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Historial de Series */
        .sets-history {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .set-chip {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .set-chip-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .advice-tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
        }

        .advice-up { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .advice-ok { background: rgba(16, 185, 129, 0.2); color: var(--accent); }
        .advice-down { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .btn-del-chip {
            background: transparent;
            border: none;
            color: var(--danger);
            font-weight: 800;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
        }

        .reset-btn {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">GYM TRACK PRO</div>
        <div class="status-badge">● Guardado</div>
    </header>

    <div class="summary-card">
        <div class="summary-header">
            <span>PROGRESO SEMANAL</span>
            <div class="summary-counter" id="total-summary">0 / 0 Series</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="total-progress-bar"></div>
        </div>
    </div>

    <div class="day-selector">
        <button class="day-btn active" onclick="setDay('lunes')">Lunes</button>
        <button class="day-btn" onclick="setDay('miercoles')">Miércoles</button>
        <button class="day-btn" onclick="setDay('viernes')">Viernes</button>
    </div>

    <div class="muscle-cards-list" id="cards-container"></div>

    <button class="reset-btn" onclick="resetWeek()">Reiniciar Series Semanales</button>

    <script>
        const initialConfig = [
            { id: 'pecho', name: 'PECHO', targetSeries: 12, minReps: 6, maxReps: 8, defaultExercises: ['Banco Plano', 'Inclinado con Mancuernas', 'Fondos en Paralelas', 'Aperturas'] },
            { id: 'espalda', name: 'ESPALDA', targetSeries: 15, minReps: 5, maxReps: 8, defaultExercises: ['Remo Bajo (Triángulo)', 'Remo en Máquina Inclinado', 'Remo Sentado en Máquina', 'Jalón al Pecho Agarre Abierto'] },
            { id: 'hombros', name: 'HOMBROS', targetSeries: 9, minReps: 8, maxReps: 10, defaultExercises: ['Press Militar', 'Elevaciones Laterales', 'Pájaro (Hombro Posterior)'] },
            { id: 'biceps', name: 'BÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Curl Martillo', 'Curl Parado con Barra/Mancuerna', 'Curl Extensión por Detrás (Inclinado)'] },
            { id: 'triceps', name: 'TRÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Press Francés', 'Extensión en Polea con Cuerda', 'Extensión Copa sobre la Cabeza'] },
            { id: 'cuadriceps', name: 'CUÁDRICEPS', targetSeries: 12, minReps: 5, maxReps: 8, defaultExercises: ['Sentadillas en Máquina / Hack', 'Prensa de Piernas', 'Extensión de Cuádriceps'] },
            { id: 'isquios', name: 'ISQUIOS', targetSeries: 10, minReps: 6, maxReps: 10, defaultExercises: ['Peso Muerto Rumano', 'Curl Femoral Acostado', 'Curl Femoral Parado'] },
            { id: 'abductores', name: 'ABDUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Abductores en Máquina'] },
            { id: 'aductores', name: 'ADUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Aductores en Máquina'] },
            { id: 'pantorrillas', name: 'PANTORRILLAS', targetSeries: 9, minReps: 8, maxReps: 15, defaultExercises: ['Elevación de Talones Sentado', 'Elevación de Talones Parado'] }
        ];

        let activeDay = 'lunes';
        let store = JSON.parse(localStorage.getItem('gym_tracker_pro_v5')) || {};
        let openAccordions = {};

        function setDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === day);
            });
            render();
        }

        function toggleAccordion(id) {
            openAccordions[id] = !openAccordions[id];
            render();
        }

        function handleSelectChange(muscleId) {
            const select = document.getElementById(`select-ex-${muscleId}`);
            const customInput = document.getElementById(`input-custom-ex-${muscleId}`);
            if (select.value === 'CUSTOM') {
                customInput.style.display = 'block';
            } else {
                customInput.style.display = 'none';
            }
        }

        function addSet(muscleId, minReps, maxReps) {
            initStore(muscleId);
            const select = document.getElementById(`select-ex-${muscleId}`);
            const customInput = document.getElementById(`input-custom-ex-${muscleId}`);
            
            let exName = select.value;
            if (exName === 'CUSTOM') {
                exName = customInput.value.trim();
                if (exName && !store[muscleId].customExercises.includes(exName)) {
                    store[muscleId].customExercises.push(exName);
                }
            }

            const reps = parseInt(document.getElementById(`input-reps-${muscleId}`).value);
            const weight = parseFloat(document.getElementById(`input-weight-${muscleId}`).value) || 0;

            if (!exName || isNaN(reps)) {
                alert('Por favor selecciona un ejercicio e ingresa las repeticiones.');
                return;
            }

            // Análisis de carga de peso
            let advice = { text: '🎯 Peso ideal', class: 'advice-ok' };
            if (reps > maxReps) {
                advice = { text: '⚡ Sube peso (Hiciste muchas reps)', class: 'advice-up' };
            } else if (reps < minReps) {
                advice = { text: '⚠️ Muy pesado (Baja un poco el peso)', class: 'advice-down' };
            }

            store[muscleId][activeDay].sets.push({
                exName,
                reps,
                weight,
                advice
            });

            save();
            render();
        }

        function removeSet(muscleId, setIndex) {
            if (store[muscleId] && store[muscleId][activeDay]) {
                store[muscleId][activeDay].sets.splice(setIndex, 1);
                save();
                render();
            }
        }

        function initStore(id) {
            if (!store[id]) store[id] = { customExercises: [] };
            if (!store[id].customExercises) store[id].customExercises = [];
            if (!store[id][activeDay]) store[id][activeDay] = { sets: [] };
        }

        function save() {
            localStorage.setItem('gym_tracker_pro_v5', JSON.stringify(store));
        }

        function render() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            let grandTotalDone = 0;
            let grandTotalTarget = 0;

            initialConfig.forEach(item => {
                initStore(item.id);
                const itemStore = store[item.id];
                
                const lunesCount = (itemStore.lunes && itemStore.lunes.sets) ? itemStore.lunes.sets.length : 0;
                const miercolesCount = (itemStore.miercoles && itemStore.miercoles.sets) ? itemStore.miercoles.sets.length : 0;
                const viernesCount = (itemStore.viernes && itemStore.viernes.sets) ? itemStore.viernes.sets.length : 0;

                const totalDoneWeek = lunesCount + miercolesCount + viernesCount;
                const remainingWeek = Math.max(0, item.targetSeries - totalDoneWeek);
                const isCompleted = remainingWeek === 0;

                grandTotalDone += totalDoneWeek;
                grandTotalTarget += item.targetSeries;

                const daySets = (itemStore[activeDay] && itemStore[activeDay].sets) ? itemStore[activeDay].sets : [];
                const isOpen = !!openAccordions[item.id];

                // Lista de ejercicios mezclada (por defecto + personalizados guardados)
                const allExercises = [...item.defaultExercises, ...itemStore.customExercises];

                let setsChipsHTML = '';
                if (daySets.length > 0) {
                    setsChipsHTML = daySets.map((s, idx) => `
                        <div class="set-chip">
                            <div class="set-chip-info">
                                <span><strong>${s.exName}:</strong> ${s.reps} reps @ ${s.weight} kg</span>
                                <span class="advice-tag ${s.advice.class}">${s.advice.text}</span>
                            </div>
                            <button class="btn-del-chip" onclick="removeSet('${item.id}', ${idx})">✕</button>
                        </div>
                    `).join('');
                } else {
                    setsChipsHTML = `<div style="font-size:0.72rem; color:var(--text-sub);">Sin series registradas hoy</div>`;
                }

                const optionsHTML = allExercises.map(ex => `<option value="${ex}">${ex}</option>`).join('') + `<option value="CUSTOM">+ Otro ejercicio...</option>`;

                const card = document.createElement('div');
                card.className = `muscle-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="muscle-title">${item.name}</div>
                            <div class="target-info">Rango rec: ${item.minReps}-${item.maxReps} reps</div>
                        </div>
                        <div class="remaining-badge ${isCompleted ? 'done' : ''}">
                            ${isCompleted ? '✓ COMPLETADO' : `Faltan ${remainingWeek} series`}
                        </div>
                    </div>

                    <button class="accordion-trigger" onclick="toggleAccordion('${item.id}')">
                        <span>${daySets.length} series registradas hoy</span>
                        <span>${isOpen ? '▲ Ocultar' : '▼ Anotar Serie'}</span>
                    </button>

                    <div class="accordion-content ${isOpen ? 'open' : ''}">
                        <div class="input-row">
                            <select class="select-ex" id="select-ex-${item.id}" onchange="handleSelectChange('${item.id}')">
                                ${optionsHTML}
                            </select>
                            <input type="text" class="input-custom-ex" id="input-custom-ex-${item.id}" placeholder="Escribe el nuevo ejercicio..." style="display:none;">
                            <div class="input-fields">
                                <input type="number" id="input-reps-${item.id}" placeholder="Reps">
                                <input type="number" id="input-weight-${item.id}" placeholder="Peso (kg)">
                            </div>
                            <button class="btn-add-set" onclick="addSet('${item.id}', ${item.minReps}, ${item.maxReps})">+ Registrar Serie</button>
                        </div>
                        <div class="sets-history">
                            ${setsChipsHTML}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const pct = Math.min(100, Math.round((grandTotalDone / grandTotalTarget) * 100));
            document.getElementById('total-summary').innerText = `${grandTotalDone} / ${grandTotalTarget} Series (${pct}%)`;
            document.getElementById('total-progress-bar').style.width = `${pct}%`;
        }

        function resetWeek() {
            if (confirm('¿Reiniciar la semana? Se borrarán las series a
