<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker - Rutina Semanal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text);
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background: var(--bg-card);
            color: var(--text);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            font-size: 0.9rem;
        }

        .muscle-name {
            font-weight: 600;
            color: #fff;
        }

        .badge {
            background: var(--bg-input);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
        }

        input[type="number"] {
            width: 60px;
            padding: 6px 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            text-align: center;
            font-weight: 500;
        }

        input[type="number"]:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-bar-fill.complete {
            background: var(--success);
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Control de Rutina Semanal</h1>
        <p class="subtitle">Gestiona tus series, cargas y volumen semanal fácilmente</p>
    </header>

    <div class="actions">
        <button class="btn btn-outline" onclick="resetWeek()">Reiniciar Semana</button>
        <span id="save-status" style="color: var(--success); font-size: 0.85rem;">✓ Guardado automático</span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Músculo</th>
                    <th>Meta Series</th>
                    <th>Reps Rec.</th>
                    <th>Lunes</th>
                    <th>Miércoles</th>
                    <th>Viernes</th>
                    <th>Series Totales</th>
                    <th>Peso (kg)</th>
                </tr>
            </thead>
            <tbody id="routine-body">
                <!-- Se genera dinámicamente mediante JS -->
            </tbody>
        </table>
    </div>

    <script>
        const initialData = [
            { id: 'pecho', name: 'PECHO', targetSeries: 12, reps: '6 - 8' },
            { id: 'espalda', name: 'ESPALDA', targetSeries: 15, reps: '5 - 8' },
            { id: 'hombros', name: 'HOMBROS', targetSeries: 9, reps: '8 - 10' },
            { id: 'biceps', name: 'BÍCEPS', targetSeries: 9, reps: '8 - 12' },
            { id: 'triceps', name: 'TRÍCEPS', targetSeries: 9, reps: '8 - 12' },
            { id: 'cuadriceps', name: 'CUÁDRICEPS', targetSeries: 12, reps: '5 - 8' },
            { id: 'isquios', name: 'ISQUIOS', targetSeries: 10, reps: '6 - 10' },
            { id: 'abductores', name: 'ABDUCTORES', targetSeries: 4, reps: '-' },
            { id: 'aductores', name: 'ADUCTORES', targetSeries: 4, reps: '-' },
            { id: 'pantorrillas', name: 'PANTORRILLAS', targetSeries: 9, reps: '8 - 15' }
        ];

        function loadState() {
            const saved = localStorage.getItem('gym_routine_data');
            return saved ? JSON.parse(saved) : {};
        }

        function saveState(data) {
            localStorage.setItem('gym_routine_data', JSON.stringify(data));
            const status = document.getElementById('save-status');
            status.style.opacity = '1';
            setTimeout(() => { status.style.opacity = '0.7'; }, 1000);
        }

        let state = loadState();

        function render() {
            const tbody = document.getElementById('routine-body');
            tbody.innerHTML = '';

            initialData.forEach(item => {
                const itemData = state[item.id] || { lunes: 0, miercoles: 0, viernes: 0, peso: 0 };
                const totalSeries = (parseInt(itemData.lunes) || 0) + (parseInt(itemData.miercoles) || 0) + (parseInt(itemData.viernes) || 0);
                const progressPct = Math.min(100, Math.round((totalSeries / item.targetSeries) * 100));
                const isComplete = totalSeries >= item.targetSeries;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="muscle-name">${item.name}</td>
                    <td><span class="badge">${item.targetSeries} series</span></td>
                    <td><span class="badge">${item.reps}</span></td>
                    <td><input type="number" min="0" value="${itemData.lunes || ''}" onchange="updateValue('${item.id}', 'lunes', this.value)"></td>
                    <td><input type="number" min="0" value="${itemData.miercoles || ''}" onchange="updateValue('${item.id}', 'miercoles', this.value)"></td>
                    <td><input type="number" min="0" value="${itemData.viernes || ''}" onchange="updateValue('${item.id}', 'viernes', this.value)"></td>
                    <td>
                        <strong style="color: ${isComplete ? 'var(--success)' : 'white'}">${totalSeries} / ${item.targetSeries}</strong>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill ${isComplete ? 'complete' : ''}" style="width: ${progressPct}%"></div>
                        </div>
                    </td>
                    <td><input type="number" step="0.5" min="0" value="${itemData.peso || ''}" placeholder="kg" onchange="updateValue('${item.id}', 'peso', this.value)"></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateValue(id, key, val) {
            if (!state[id]) state[id] = {};
            state[id][key] = val === '' ? 0 : parseFloat(val);
            saveState(state);
            render();
        }

        function resetWeek() {
            if (confirm('¿Quieres reiniciar todas las series semanales?')) {
                state = {};
                saveState(state);
                render();
            }
        }

        render();
    </script>
</body>
</html>
