<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Track Pro - Auto Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151c2c;
            --primary: #6366f1;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #26334d;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background-color: var(--bg);
            color: var(--text);
        }

        body {
            padding: 12px;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
        }

        .status-badge {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .summary-card {
            background: linear-gradient(135deg, #1e1b4b, var(--surface));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .summary-header span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .summary-counter {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        .day-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .day-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 4px;
            font-weight: 700;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .day-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .muscle-cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .muscle-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            width: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .muscle-title {
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .target-info {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .remaining-badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #a5b4fc;
            text-align: right;
            white-space: nowrap;
        }

        .remaining-badge.done {
            color: var(--accent);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .accordion-trigger {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            width: 100%;
        }

        .accordion-content {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .accordion-content.open {
            display: flex;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            background: var(--bg);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .select-ex, .input-custom-ex {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
        }

        .input-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }

        .input-fields input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
        }

        .btn-add-set {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .sets-history {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .set-chip {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .set-chip-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .advice-tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
        }

        .advice-up { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .advice-ok { background: rgba(16, 185, 129, 0.2); color: var(--accent); }
        .advice-down { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .smart-coach-box {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.73rem;
            color: #c7d2fe;
            line-height: 1.35;
        }

        .smart-coach-title {
            font-weight: 800;
            color: #a5b4fc;
            margin-bottom: 3px;
        }

        .btn-del-chip {
            background: transparent;
            border: none;
            color: var(--danger);
            font-weight: 800;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
        }

        .auto-reset-info {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            z-index: 100;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">GYM TRACK PRO</div>
        <div class="status-badge">● Carga Progresiva</div>
    </header>

    <div class="summary-card">
        <div class="summary-header">
            <span>PROGRESO SEMANAL</span>
            <div class="summary-counter" id="total-summary">0 / 0 Series</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="total-progress-bar"></div>
        </div>
    </div>

    <div class="day-selector">
        <button class="day-btn active" id="btn-lunes" onclick="setDay('lunes')">Lunes</button>
        <button class="day-btn" id="btn-miercoles" onclick="setDay('miercoles')">Miércoles</button>
        <button class="day-btn" id="btn-viernes" onclick="setDay('viernes')">Viernes</button>
    </div>

    <div class="muscle-cards-list" id="cards-container"></div>

    <div class="auto-reset-info">🔄 Reinicio automático todos los Domingos 00:00</div>

    <script>
        const initialConfig = [
            { id: 'pecho', name: 'PECHO', targetSeries: 12, minReps: 6, maxReps: 8, defaultExercises: ['Banco Plano', 'Inclinado con Mancuernas', 'Fondos en Paralelas', 'Aperturas'] },
            { id: 'espalda', name: 'ESPALDA', targetSeries: 15, minReps: 5, maxReps: 8, defaultExercises: ['Remo Bajo (Triángulo)', 'Remo en Máquina Inclinado', 'Remo Sentado en Máquina', 'Jalón al Pecho Agarre Abierto'] },
            { id: 'hombros', name: 'HOMBROS', targetSeries: 9, minReps: 8, maxReps: 10, defaultExercises: ['Press Militar', 'Elevaciones Laterales', 'Pájaro (Hombro Posterior)'] },
            { id: 'biceps', name: 'BÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Curl Martillo', 'Curl Parado con Barra/Mancuerna', 'Curl Extensión por Detrás (Inclinado)'] },
            { id: 'triceps', name: 'TRÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Press Francés', 'Extensión en Polea con Cuerda', 'Extensión Copa sobre la Cabeza'] },
            { id: 'cuadriceps', name: 'CUÁDRICEPS', targetSeries: 12, minReps: 5, maxReps: 8, defaultExercises: ['Sentadillas en Máquina / Hack', 'Prensa de Piernas', 'Extensión de Cuádriceps'] },
            { id: 'isquios', name: 'ISQUIOS', targetSeries: 10, minReps: 6, maxReps: 10, defaultExercises: ['Peso Muerto Rumano', 'Curl Femoral Acostado', 'Curl Femoral Parado'] },
            { id: 'abductores', name: 'ABDUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Abductores en Máquina'] },
            { id: 'aductores', name: 'ADUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Aductores en Máquina'] },
            { id: 'pantorrillas', name: 'PANTORRILLAS', targetSeries: 9, minReps: 8, maxReps: 15, defaultExercises: ['Elevación de Talones Sentado', 'Elevación de Talones Parado'] }
        ];

        let activeDay = 'lunes';
        let store = {};
        let exerciseHistory = {};
        let openAccordions = {};

        function ensureStore(id) {
            if (!store[id] || typeof store[id] !== 'object') store[id] = {};
            if (!Array.isArray(store[id].customExercises)) store[id].customExercises = [];
            if (!Array.isArray(store[id].lunes)) store[id].lunes = [];
            if (!Array.isArray(store[id].miercoles)) store[id].miercoles = [];
            if (!Array.isArray(store[id].viernes)) store[id].viernes = [];
        }

        function initApp() {
            // Limpieza forzada de versiones viejas corruptas
            if (!localStorage.getItem('gym_v4_clean')) {
                localStorage.clear();
                localStorage.setItem('gym_v4_clean', 'true');
            }

            try {
                const savedStore = localStorage.getItem('gym_tracker_v4_store');
                const savedHistory = localStorage.getItem('gym_tracker_v4_history');

                if (savedStore) store = JSON.parse(savedStore);
                if (savedHistory) exerciseHistory = JSON.parse(savedHistory);
            } catch (e) {
                store = {};
                exerciseHistory = {};
            }

            initialConfig.forEach(item => ensureStore(item.id));
            render();
        }

        function save() {
            try {
                localStorage.setItem('gym_tracker_v4_store', JSON.stringify(store));
                localStorage.setItem('gym_tracker_v4_history', JSON.stringify(exerciseHistory));
            } catch (e) {}
        }

        function setDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${day}`).classList.add('active');
            render();
        }

        function toggleAccordion(id) {
            openAccordions[id] = !openAccordions[id];
            render();
        }

        function handleSelectChange(muscleId) {
            const select = document.getElementById(`select-${muscleId}`);
            const customInput = document.getElementById(`custom-${muscleId}`);
            if (select && customInput) {
                customInput.style.display = (select.value === 'CUSTOM') ? 'block' : 'none';
            }
            renderCoachAdvice(muscleId);
        }

        function getSmartCoachAdvice(muscleId, selectedEx) {
            const config = initialConfig.find(c => c.id === muscleId);
            const history = exerciseHistory[selectedEx];

            if (!history || !history.sets || history.sets.length === 0) {
                return `💡 <strong>Inicio:</strong> Elige un peso para hacer entre <strong>${config.minReps} y ${config.maxReps} reps</strong>.`;
            }

            const lastSet = history.sets[history.sets.length - 1];

            if (lastSet.reps > config.maxReps) {
                const nextWeight = (lastSet.weight > 0) ? (lastSet.weight * 1.05).toFixed(1) : 0;
                return `🚀 <strong>Sube de carga:</strong> La última vez hiciste ${lastSet.reps} reps con ${lastSet.weight}kg. Hoy intenta <strong>${nextWeight}kg</strong> para ${config.minReps}-${config.maxReps} reps.`;
            } 
            
            if (lastSet.reps < config.minReps) {
                return `⚖️ <strong>Ajuste:</strong> Caíste a ${lastSet.reps} reps con ${lastSet.weight}kg. Mantén <strong>${lastSet.weight}kg</strong> y descansa un poco más.`;
            }

            return `🎯 <strong>Consolidación:</strong> Hiciste ${lastSet.reps} reps con ${lastSet.weight}kg. Mantén <strong>${lastSet.weight}kg</strong> e intenta 1 rep extra.`;
        }

        function renderCoachAdvice(muscleId) {
            const select = document.getElementById(`select-${muscleId}`);
            const coachBox = document.getElementById(`coach-${muscleId}`);

            if (select && coachBox) {
                const exName = select.value === 'CUSTOM' ? '' : select.value;
                coachBox.innerHTML = `
                    <div class="smart-coach-title">🤖 PLAN DE HOY:</div>
                    <div>${getSmartCoachAdvice(muscleId, exName)}</div>
                `;
            }
        }

        function addSet(muscleId, minReps, maxReps) {
            ensureStore(muscleId);
            const select = document.getElementById(`select-${muscleId}`);
            const customInput = document.getElementById(`custom-${muscleId}`);
            const repsInput = document.getElementById(`reps-${muscleId}`);
            const weightInput = document.getElementById(`weight-${muscleId}`);

            let exName = select ? select.value : '';
            if (exName === 'CUSTOM') {
                exName = customInput.value.trim();
                if (exName && !store[muscleId].customExercises.includes(exName)) {
                    store[muscleId].customExercises.push(exName);
                }
            }

            const reps = parseInt(repsInput.value);
            const weight = parseFloat(weightInput.value) || 0;

            if (!exName || isNaN(reps)) {
                alert('Ingresa las repeticiones y elige un ejercicio.');
                return;
            }

            let adviceText = '🎯 Peso ideal';
            let adviceClass = 'advice-ok';

            if (reps > maxReps) {
                adviceText = '⚡ Sube peso';
                adviceClass = 'advice-up';
            } else if (reps < minReps) {
                adviceText = '⚠️ Muy pesado';
                adviceClass = 'advice-down';
            }

            const setObj = {
                exName: exName,
                reps: reps,
                weight: weight,
                adviceText: adviceText,
                adviceClass: adviceClass
            };

            store[muscleId][activeDay].push(setObj);

            if (!exerciseHistory[exName]) exerciseHistory[exName] = { sets: [] };
            exerciseHistory[exName].sets.push(setObj);

            repsInput.value = '';
            weightInput.value = '';

            save();
            render();
        }

        function removeSet(muscleId, index) {
            ensureStore(muscleId);
            store[muscleId][activeDay].splice(index, 1);
            save();
            render();
        }

        function render() {
            const container = document.getElementById('cards-container');
            if (!container) return;
            container.innerHTML = '';

            let grandTotalDone = 0;
            let grandTotalTarget = 0;

            initialConfig.forEach(item => {
                ensureStore(item.id);
                const itemData = store[item.id];

                const totalDoneWeek = (itemData.lunes?.length || 0) + (itemData.miercoles?.length || 0) + (itemData.viernes?.length || 0);
                const remainingWeek = Math.max(0, item.targetSeries - totalDoneWeek);
                const isCompleted = remainingWeek === 0;

                grandTotalDone += totalDoneWeek;
                grandTotalTarget += item.targetSeries;

                const daySets = itemData[activeDay] || [];
                const isOpen = !!openAccordions[item.id];
                const allExercises = [...item.defaultExercises, ...(itemData.customExercises || [])];

                let setsHTML = '';
                if (daySets.length > 0) {
                    setsHTML = daySets.map((s, idx) => `
                        <div class="set-chip">
                            <div class="set-chip-info">
                                <span><strong>${s.exName}:</strong> ${s.reps} reps @ ${s.weight} kg</span>
                                <span class="advice-tag ${s.adviceClass}">${s.adviceText}</span>
                            </div>
                            <button class="btn-del-chip" onclick="removeSet('${item.id}', ${idx})">✕</button>
                        </div>
