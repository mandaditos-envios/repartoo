<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Track Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151c2c;
            --primary: #6366f1;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #26334d;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden; /* Evita cualquier desborde horizontal */
            background-color: var(--bg);
            color: var(--text);
        }

        body {
            padding: 12px;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
        }

        .status-badge {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 600;
            background: var(--accent-glow);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Card resumen */
        .summary-card {
            background: linear-gradient(135deg, #1e1b4b, var(--surface));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .summary-header span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .summary-counter {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Selector Días */
        .day-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .day-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 4px;
            font-weight: 700;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .day-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Contenedor de Tarjetas */
        .muscle-cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .muscle-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .muscle-card.completed {
            border-color: var(--accent);
            background: linear-gradient(180deg, var(--surface), rgba(16, 185, 129, 0.05));
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .muscle-title {
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .target-info {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .daily-target-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            color: #818cf8;
            background: rgba(99, 102, 241, 0.12);
            padding: 3px 6px;
            border-radius: 6px;
            margin-top: 4px;
        }

        .remaining-badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #a5b4fc;
            text-align: right;
            white-space: nowrap;
        }

        .remaining-badge.done {
            color: var(--accent);
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* Botón Desplegable */
        .accordion-trigger {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            width: 100%;
        }

        .accordion-content {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .accordion-content.open {
            display: flex;
        }

        /* Formulario de entrada responsive */
        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .input-fields {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 6px;
            width: 100%;
        }

        .input-row input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
        }

        .input-row input:focus {
            border-color: var(--primary);
        }

        .btn-add-set {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Chips de series completadas */
        .sets-history {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }

        .set-chip {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .set-chip strong {
            color: #fff;
        }

        .btn-del-chip {
            background: transparent;
            border: none;
            color: #f87171;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .reset-btn {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">GYM TRACKER</div>
        <div class="status-badge">● Guardado</div>
    </header>

    <!-- Resumen -->
    <div class="summary-card">
        <div class="summary-header">
            <span>AVANCE SEMANAL</span>
            <div class="summary-counter" id="total-summary">0 / 0 Series</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="total-progress-bar"></div>
        </div>
    </div>

    <!-- Días -->
    <div class="day-selector">
        <button class="day-btn active" onclick="setDay('lunes')">Lunes</button>
        <button class="day-btn" onclick="setDay('miercoles')">Miércoles</button>
        <button class="day-btn" onclick="setDay('viernes')">Viernes</button>
    </div>

    <!-- Lista de Músculos -->
    <div class="muscle-cards-list" id="cards-container"></div>

    <button class="reset-btn" onclick="resetWeek()">Reiniciar Semana</button>

    <script>
        const musclesConfig = [
            { id: 'pecho', name: 'PECHO', targetSeries: 12, reps: '6-8 reps', dailySuggested: 4 },
            { id: 'espalda', name: 'ESPALDA', targetSeries: 15, reps: '5-8 reps', dailySuggested: 5 },
            { id: 'hombros', name: 'HOMBROS', targetSeries: 9, reps: '8-10 reps', dailySuggested: 3 },
            { id: 'biceps', name: 'BÍCEPS', targetSeries: 9, reps: '8-12 reps', dailySuggested: 3 },
            { id: 'triceps', name: 'TRÍCEPS', targetSeries: 9, reps: '8-12 reps', dailySuggested: 3 },
            { id: 'cuadriceps', name: 'CUÁDRICEPS', targetSeries: 12, reps: '5-8 reps', dailySuggested: 4 },
            { id: 'isquios', name: 'ISQUIOS', targetSeries: 10, reps: '6-10 reps', dailySuggested: 3.5 },
            { id: 'abductores', name: 'ABDUCTORES', targetSeries: 4, reps: 'Libre', dailySuggested: 2 },
            { id: 'aductores', name: 'ADUCTORES', targetSeries: 4, reps: 'Libre', dailySuggested: 2 },
            { id: 'pantorrillas', name: 'PANTORRILLAS', targetSeries: 9, reps: '8-15 reps', dailySuggested: 3 }
        ];

        let activeDay = 'lunes';
        let store = JSON.parse(localStorage.getItem('gym_tracker_v4')) || {};
        let openAccordions = {};

        function setDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === day);
            });
            render();
        }

        function toggleAccordion(id) {
            openAccordions[id] = !openAccordions[id];
            render();
        }

        function addSet(muscleId) {
            initStore(muscleId);
            const exName = document.getElementById(`input-ex-${muscleId}`).value.trim() || 'Serie';
            const reps = document.getElementById(`input-reps-${muscleId}`).value.trim();
            const weight = document.getElementById(`input-weight-${muscleId}`).value.trim();

            if (!reps) {
                alert('Ingresa la cantidad de reps');
                return;
            }

            store[muscleId][activeDay].sets.push({
                exName,
                reps: reps,
                weight: weight || '0'
            });

            save();
            render();
        }

        function removeSet(muscleId, setIndex) {
            if (store[muscleId] && store[muscleId][activeDay]) {
                store[muscleId][activeDay].sets.splice(setIndex, 1);
                save();
                render();
            }
        }

        function initStore(id) {
            if (!store[id]) store[id] = {};
            if (!store[id][activeDay]) store[id][activeDay] = { sets: [] };
        }

        function save() {
            localStorage.setItem('gym_tracker_v4', JSON.stringify(store));
        }

        function render() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            let grandTotalDone = 0;
            let grandTotalTarget = 0;

            musclesConfig.forEach(item => {
                const itemStore = store[item.id] || {};
                
                const lunesCount = (itemStore.lunes && itemStore.lunes.sets) ? itemStore.lunes.sets.length : 0;
                const miercolesCount = (itemStore.miercoles && itemStore.miercoles.sets) ? itemStore.miercoles.sets.length : 0;
                const viernesCount = (itemStore.viernes && itemStore.viernes.sets) ? itemStore.viernes.sets.length : 0;

                const totalDoneWeek = lunesCount + miercolesCount + viernesCount;
                const remainingWeek = Math.max(0, item.targetSeries - totalDoneWeek);
                const isCompleted = remainingWeek === 0;

                grandTotalDone += totalDoneWeek;
                grandTotalTarget += item.targetSeries;

                const daySets = (itemStore[activeDay] && itemStore[activeDay].sets) ? itemStore[activeDay].sets : [];
                const isOpen = !!openAccordions[item.id];

                let setsChipsHTML = '';
                if (daySets.length > 0) {
                    setsChipsHTML = daySets.map((s, idx) => `
                        <div class="set-chip">
                            <span><strong>${s.exName}:</strong> ${s.reps} reps @ ${s.weight}kg</span>
                            <button class="btn-del-chip" onclick="removeSet('${item.id}', ${idx})">✕</button>
                        </div>
                    `).join('');
                } else {
                    setsChipsHTML = `<div style="font-size:0.72rem; color:var(--text-sub);">Sin series anotadas hoy</div>`;
                }

                const card = document.createElement('div');
                card.className = `muscle-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="muscle-title">${item.name}</div>
                            <div class="target-info">${item.reps}</div>
                            <div class="daily-target-tag">Hoy: ~${Math.ceil(item.dailySuggested)} series</div>
                        </div>
                        <div class="remaining-badge ${isCompleted ? 'done' : ''}">
                            ${isCompleted ? '✓ COMPLETADO' : `Faltan ${remainingWeek} series`}
                        </div>
                    </div>

                    <button class="accordion-trigger" onclick="toggleAccordion('${item.id}')">
                        <span>${daySets.length} series hoy</span>
                        <span>${isOpen ? '▲ Ocultar' : '▼ Anotar Serie'}</span>
                    </button>

                    <div class="accordion-content ${isOpen ? 'open' : ''}">
                        <div class="input-row">
                            <div class="input-fields">
                                <input type="text" id="input-ex-${item.id}" placeholder="Ej: Press">
                                <input type="number" id="input-reps-${item.id}" placeholder="Reps">
                                <input type="number" id="input-weight-${item.id}" placeholder="Kg">
                            </div>
                            <button class="btn-add-set" onclick="addSet('${item.id}')">+ Agregar Serie</button>
                        </div>
                        <div class="sets-history">
                            ${setsChipsHTML}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const pct = Math.min(100, Math.round((grandTotalDone / grandTotalTarget) * 100));
            document.getElementById('total-summary').innerText = `${grandTotalDone} / ${grandTotalTarget} Series (${pct}%)`;
            document.getElementById('total-progress-bar').style.width = `${pct}%`;
        }

        function resetWeek() {
            if (confirm('¿Quieres reiniciar todas las series de esta semana?')) {
                store = {};
                save();
                render();
            }
        }

        render();
    </script>
</body>
</html>
