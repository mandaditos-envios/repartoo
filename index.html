<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Track Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #131b2e;
            --surface-card: #182238;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #22c55e;
            --text: #f8fafc;
            --text-muted: #64748b;
            --border: #23314d;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 90px;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overall-progress-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: var(--bg);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 20px;
        }

        .day-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .card.completed {
            border-color: rgba(34, 197, 94, 0.4);
            background: linear-gradient(180deg, var(--surface-card), rgba(34, 197, 94, 0.05));
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .muscle-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .muscle-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        .badge-target {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a5b4fc;
        }

        .card-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            padding: 8px 12px;
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-counter {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: var(--surface);
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .btn-counter:active {
            transform: scale(0.95);
        }

        .counter-val {
            font-size: 1rem;
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        /* Seccion Desplegable */
        .toggle-details-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 4px;
        }

        .details-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .details-container.open {
            display: flex;
        }

        .exercise-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 6px;
        }

        .exercise-form input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
        }

        .exercise-form input:focus {
            border-color: var(--primary);
        }

        .btn-add-ex {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .exercise-item span.name {
            font-weight: 600;
            color: #fff;
        }

        .exercise-item span.meta {
            color: var(--text-muted);
        }

        .btn-del-ex {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: 8px;
        }

        .reset-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">GYM TRACKER</div>
        <span id="save-indicator" style="font-size: 0.75rem; color: var(--accent); font-weight: 600;">● Guardado</span>
    </header>

    <div class="overall-progress-card">
        <div class="progress-header">
            <span>PROGRESO SEMANAL</span>
            <span id="overall-percentage">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="overall-bar"></div>
        </div>
    </div>

    <!-- Pestañas por Día -->
    <div class="day-tabs">
        <button class="tab-btn active" onclick="switchDay('lunes')">Lunes</button>
        <button class="tab-btn" onclick="switchDay('miercoles')">Miércoles</button>
        <button class="tab-btn" onclick="switchDay('viernes')">Viernes</button>
    </div>

    <!-- Lista de tarjetas -->
    <div class="cards-list" id="cards-container"></div>

    <button class="reset-btn" onclick="resetWeek()">Reiniciar Semana</button>

    <script>
        const muscleData = [
            { id: 'pecho', name: 'PECHO', targetSeries: 12, reps: '6-8 reps' },
            { id: 'espalda', name: 'ESPALDA', targetSeries: 15, reps: '5-8 reps' },
            { id: 'hombros', name: 'HOMBROS', targetSeries: 9, reps: '8-10 reps' },
            { id: 'biceps', name: 'BÍCEPS', targetSeries: 9, reps: '8-12 reps' },
            { id: 'triceps', name: 'TRÍCEPS', targetSeries: 9, reps: '8-12 reps' },
            { id: 'cuadriceps', name: 'CUÁDRICEPS', targetSeries: 12, reps: '5-8 reps' },
            { id: 'isquios', name: 'ISQUIOS', targetSeries: 10, reps: '6-10 reps' },
            { id: 'abductores', name: 'ABDUCTORES', targetSeries: 4, reps: 'Libre' },
            { id: 'aductores', name: 'ADUCTORES', targetSeries: 4, reps: 'Libre' },
            { id: 'pantorrillas', name: 'PANTORRILLAS', targetSeries: 9, reps: '8-15 reps' }
        ];

        let currentDay = 'lunes';
        let state = JSON.parse(localStorage.getItem('gym_tracker_v3')) || {};
        let openAccordions = {};

        function switchDay(day) {
            currentDay = day;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === day);
            });
            render();
        }

        function toggleAccordion(id) {
            openAccordions[id] = !openAccordions[id];
            render();
        }

        function updateSeries(id, delta) {
            initMuscleState(id);
            const currentVal = state[id][currentDay].series || 0;
            state[id][currentDay].series = Math.max(0, currentVal + delta);
            save();
            render();
        }

        function addExercise(id) {
            initMuscleState(id);
            const nameInput = document.getElementById(`ex-name-${id}`);
            const repsInput = document.getElementById(`ex-reps-${id}`);
            const weightInput = document.getElementById(`ex-weight-${id}`);

            const name = nameInput.value.trim();
            const reps = repsInput.value.trim();
            const weight = weightInput.value.trim();

            if (!name) return;

            if (!state[id][currentDay].exercises) {
                state[id][currentDay].exercises = [];
            }

            state[id][currentDay].exercises.push({ name, reps: reps || '0', weight: weight || '0' });
            save();
            render();
        }

        function deleteExercise(id, index) {
            if (state[id] && state[id][currentDay] && state[id][currentDay].exercises) {
                state[id][currentDay].exercises.splice(index, 1);
                save();
                render();
            }
        }

        function initMuscleState(id) {
            if (!state[id]) state[id] = {};
            if (!state[id][currentDay]) state[id][currentDay] = { series: 0, exercises: [] };
        }

        function save() {
            localStorage.setItem('gym_tracker_v3', JSON.stringify(state));
        }

        function calculateOverallProgress() {
            let totalDone = 0;
            let totalTarget = 0;

            muscleData.forEach(item => {
                const itemData = state[item.id] || {};
                const lunes = (itemData.lunes && itemData.lunes.series) || 0;
                const miercoles = (itemData.miercoles && itemData.miercoles.series) || 0;
                const viernes = (itemData.viernes && itemData.viernes.series) || 0;

                totalDone += lunes + miercoles + viernes;
                totalTarget += item.targetSeries;
            });

            const pct = Math.min(100, Math.round((totalDone / totalTarget) * 100));
            document.getElementById('overall-percentage').innerText = `${pct}% (${totalDone}/${totalTarget} series)`;
            document.getElementById('overall-bar').style.width = `${pct}%`;
        }

        function render() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            muscleData.forEach(item => {
                const itemData = state[item.id] || {};
                const dayData = (itemData[currentDay]) || { series: 0, exercises: [] };
                
                const lunesSeries = (itemData.lunes && itemData.lunes.series) || 0;
                const miercolesSeries = (itemData.miercoles && itemData.miercoles.series) || 0;
                const viernesSeries = (itemData.viernes && itemData.viernes.series) || 0;

                const totalWeeklySeries = lunesSeries + miercolesSeries + viernesSeries;
                const isCompleted = totalWeeklySeries >= item.targetSeries;
                const isOpen = !!openAccordions[item.id];

                const card = document.createElement('div');
                card.className = `card ${isCompleted ? 'completed' : ''}`;
                
                let exercisesHTML = '';
                if (dayData.exercises && dayData.exercises.length > 0) {
                    exercisesHTML = dayData.exercises.map((ex, idx) => `
                        <div class="exercise-item">
                            <span class="name">${ex.name}</span>
                            <div>
                                <span class="meta">${ex.reps} reps | ${ex.weight} kg</span>
                                <button class="btn-del-ex" onclick="deleteExercise('${item.id}', ${idx})">✕</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    exercisesHTML = `<div style="font-size:0.75rem; color:var(--text-muted); text-align:center;">Sin ejercicios guardados hoy</div>`;
                }

                card.innerHTML = `
                    <div class="card-top">
                        <div class="muscle-info">
                            <h3>${item.name}</h3>
                            <p>${item.reps} • Meta: ${item.targetSeries} series/sem</p>
                        </div>
                        <div class="badge-target" style="${isCompleted ? 'color: var(--accent); border-color: rgba(34,197,94,0.3);' : ''}">
                            ${totalWeeklySeries} / ${item.targetSeries} tot.
                        </div>
                    </div>

                    <div class="card-controls">
                        <div class="control-group">
                            <button class="btn-counter" onclick="updateSeries('${item.id}', -1)">-</button>
                            <span class="counter-val">${dayData.series} <small style="font-size:0.65rem; color:var(--text-muted)">hoy</small></span>
                            <button class="btn-counter" onclick="updateSeries('${item.id}', 1)">+</button>
                        </div>
                        <button class="toggle-details-btn" onclick="toggleAccordion('${item.id}')">
                            ${isOpen ? '▼ Esconder Ejercicios' : '▶ Detalle Ejercicios'}
                        </button>
                    </div>

                    <div class="details-container ${isOpen ? 'open' : ''}">
                        <div class="exercise-form">
                            <input type="text" id="ex-name-${item.id}" placeholder="Ejercicio (Ej: Press)">
                            <input type="number" id="ex-reps-${item.id}" placeholder="Reps">
                            <input type="number" id="ex-weight-${item.id}" placeholder="Kg">
                            <button class="btn-add-ex" onclick="addExercise('${item.id}')">+</button>
                        </div>
                        <div class="exercise-list">
                            ${exercisesHTML}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            calculateOverallProgress();
        }

        function resetWeek() {
            if (confirm('¿Seguro que quieres borrar los registros de esta semana?')) {
                state = {};
                save();
                render();
            }
        }

        render();
    </script>
</body>
</html>
