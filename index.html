<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Track Pro - Auto Progress</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151c2c;
            --primary: #6366f1;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #26334d;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            padding-bottom: 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .btn-reset-week {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset-week:active {
            background: rgba(239, 68, 68, 0.3);
        }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .day-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .day-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 4px;
            font-weight: 700;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .day-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .muscle-cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .muscle-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .muscle-title {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .target-info {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .remaining-badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #a5b4fc;
        }

        .accordion-trigger {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            width: 100%;
            cursor: pointer;
        }

        .accordion-content {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .accordion-content.open {
            display: flex;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg);
            padding: 10px;
            border-radius: 8px;
        }

        .select-ex, .input-custom-ex, .input-fields input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        .smart-coach-box {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.75rem;
            color: #c7d2fe;
            line-height: 1.35;
        }

        .smart-coach-title {
            font-weight: 800;
            color: #a5b4fc;
            margin-bottom: 3px;
        }

        .input-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .btn-add-set {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .set-chip {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .day-tag-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 4px;
        }

        .advice-tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 2px;
        }

        .advice-up { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .advice-ok { background: rgba(16, 185, 129, 0.2); color: var(--accent); }
        .advice-down { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .btn-del-chip {
            background: transparent;
            border: none;
            color: var(--danger);
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">GYM TRACK PRO</div>
        <button class="btn-reset-week" onclick="resetWeek()">🔄 Reiniciar Semana</button>
    </header>

    <div class="summary-card">
        <div class="summary-header">
            <span>PROGRESO SEMANAL</span>
            <span id="total-summary">0 / 0 Series</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="total-progress-bar"></div>
        </div>
    </div>

    <div class="day-selector">
        <button class="day-btn active" id="btn-lunes" onclick="setDay('lunes')">Lunes</button>
        <button class="day-btn" id="btn-miercoles" onclick="setDay('miercoles')">Miércoles</button>
        <button class="day-btn" id="btn-viernes" onclick="setDay('viernes')">Viernes</button>
    </div>

    <div class="muscle-cards-list" id="cards-container">Cargando...</div>

    <script>
        const initialConfig = [
            { id: 'pecho', name: 'PECHO', targetSeries: 12, minReps: 6, maxReps: 8, defaultExercises: ['Banco Plano', 'Inclinado con Mancuernas', 'Fondos', 'Aperturas'] },
            { id: 'espalda', name: 'ESPALDA', targetSeries: 15, minReps: 5, maxReps: 8, defaultExercises: ['Remo Bajo (Triángulo)', 'Remo en Máquina Inclinado', 'Remo Sentado', 'Jalón al Pecho'] },
            { id: 'hombros', name: 'HOMBROS', targetSeries: 9, minReps: 8, maxReps: 10, defaultExercises: ['Press Militar', 'Elevaciones Laterales', 'Pájaro'] },
            { id: 'biceps', name: 'BÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Curl Martillo', 'Curl Parado con Barra/Mancuerna', 'Curl Inclinado'] },
            { id: 'triceps', name: 'TRÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Press Francés', 'Extensión Polea con Cuerda', 'Extensión Copa'] },
            { id: 'cuadriceps', name: 'CUÁDRICEPS', targetSeries: 12, minReps: 5, maxReps: 8, defaultExercises: ['Sentadillas / Hack', 'Prensa de Piernas', 'Extensión de Cuádriceps'] },
            { id: 'isquios', name: 'ISQUIOS', targetSeries: 10, minReps: 6, maxReps: 10, defaultExercises: ['Peso Muerto Rumano', 'Curl Femoral Acostado'] },
            { id: 'abductores', name: 'ABDUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Abductores Máquina'] },
            { id: 'aductores', name: 'ADUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Aductores Máquina'] },
            { id: 'pantorrillas', name: 'PANTORRILLAS', targetSeries: 9, minReps: 8, maxReps: 15, defaultExercises: ['Elevación Talones Sentado', 'Elevación Talones Parado'] }
        ];

        let activeDay = 'lunes';
        let store = {};
        let exerciseHistory = {};
        let openAccordions = {};

        function initApp() {
            try {
                const savedStore = localStorage.getItem('gtp_store');
                const savedHistory = localStorage.getItem('gtp_history');
                if (savedStore) store = JSON.parse(savedStore);
                if (savedHistory) exerciseHistory = JSON.parse(savedHistory);
            } catch(e) {}

            initialConfig.forEach(item => {
                if (!store[item.id]) {
                    store[item.id] = { lunes: [], miercoles: [], viernes: [] };
                }
            });
            render();
        }

        function saveData() {
            try {
                localStorage.setItem('gtp_store', JSON.stringify(store));
                localStorage.setItem('gtp_history', JSON.stringify(exerciseHistory));
            } catch(e) {}
        }

        function setDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + day).classList.add('active');
            render();
        }

        function toggleAccordion(id) {
            openAccordions[id] = !openAccordions[id];
            render();
        }

        function resetWeek() {
            if (confirm("¿Comenzar nueva semana? Se vaciarán las repeticiones de los días, pero tus ejercicios y el historial del Smart Coach se mantendrán intactos.")) {
                initialConfig.forEach(item => {
                    store[item.id] = { lunes: [], miercoles: [], viernes: [] };
                });
                saveData();
                render();
            }
        }

        function getSmartAdvice(muscleId, exName) {
            const config = initialConfig.find(c => c.id === muscleId);
            const history = exerciseHistory[exName];

            if (!history || history.length === 0) {
                return `💡 <strong>Inicio:</strong> Sin datos previos. Elige un peso para hacer entre <strong>${config.minReps} y ${config.maxReps} reps</strong>.`;
            }

            const last = history[history.length - 1];

            if (last.reps > config.maxReps) {
                const sugg = (last.weight > 0) ? (last.weight * 1.05).toFixed(1) : last.weight;
                return `📊 <strong>Análisis semanal:</strong> Como la semana pasada superaste el objetivo (${last.reps} reps con ${last.weight}kg), te conviene subir a <strong>${sugg}kg</strong> para tu primera serie (${config.minReps}-${config.maxReps} reps).`;
            } else if (last.reps < config.minReps) {
                return `📊 <strong>Análisis semanal:</strong> La semana pasada quedaste exigido (${last.reps} reps con ${last.weight}kg). Te conviene mantener o bajar un poco a <strong>${last.weight}kg</strong> buscando llegar al mínimo de ${config.minReps} reps.`;
            } else {
                return `📊 <strong>Análisis semanal:</strong> La semana pasada completaste ${last.reps} reps con ${last.weight}kg. Te conviene empezar hoy con <strong>${last.weight}kg</strong> e intentar sumar 1 rep más.`;
            }
        }

        function updateCoachAdvice(muscleId) {
            const select = document.getElementById('select-' + muscleId);
            const coachBox = document.getElementById('coach-' + muscleId);
            const weightInput = document.getElementById('weight-' + muscleId);

            if (select && coachBox) {
                const exName = select.value;
                coachBox.innerHTML = `
                    <div class="smart-coach-title">🤖 PLAN DEL SMART COACH:</div>
                    <div>${getSmartAdvice(muscleId, exName)}</div>
                `;

                if (weightInput && exerciseHistory[exName] && exerciseHistory[exName].length > 0) {
                    const lastWeight = exerciseHistory[exName][exerciseHistory[exName].length - 1].weight;
                    if (!weightInput.value) {
                        weightInput.value = lastWeight;
                    }
                }
            }
        }

        function addSet(muscleId, minReps, maxReps) {
            const select = document.getElementById('select-' + muscleId);
            const repsInput = document.getElementById('reps-' + muscleId);
            const weightInput = document.getElementById('weight-' + muscleId);

            const exName = select.value;
            const reps = parseInt(repsInput.value);
            const weight = parseFloat(weightInput.value) || 0;

            if (!reps) return alert('Ingresa las repeticiones logradas');

            let tagText = '🎯 Peso Ideal';
            let tagClass = 'advice-ok';

            if (reps > maxReps) {
                tagText = '⚡ Sube peso';
                tagClass = 'advice-up';
            } else if (reps < minReps) {
                tagText = '⚠️ Muy pesado';
                tagClass = 'advice-down';
            }

            const setObj = { exName, reps, weight, tagText, tagClass, day: activeDay };

            store[muscleId][activeDay].push(setObj);

            if (!exerciseHistory[exName]) exerciseHistory[exName] = [];
            exerciseHistory[exName].push(setObj);

            repsInput.value = '';
            saveData();
            render();
        }

        function removeSet(muscleId, day, idx) {
            store[muscleId][day].splice(idx, 1);
            saveData();
            render();
        }

        function render() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            let grandTotalDone = 0;
            let grandTotalTarget = 0;

            initialConfig.forEach(item => {
                const daySets = store[item.id][activeDay] || [];
                const totalDoneWeek = (store[item.id].lunes?.length || 0) + (store[item.id].miercoles?.length || 0) + (store[item.id].viernes?.length || 0);
                
                grandTotalDone += totalDoneWeek;
                grandTotalTarget += item.targetSeries;

                const isOpen = !!openAccordions[item.id];
                const options = item.defaultExercises.map(ex => `<option value="${ex}">${ex}</option>`).join('');

                // Juntamos todas las series de la semana (Lunes, Miércoles, Viernes) para mostrarlas agrupadas o ver el historial reciente
                let allWeekSets = [];
                ['lunes', 'miercoles', 'viernes'].forEach(d => {
                    if (store[item.id][d]) {
                        store[item.id][d].forEach((s, idx) => {
                            allWeekSets.push({ ...s, originalDay: d, originalIdx: idx });
                        });
                    }
                });

                let setsHTML = allWeekSets.map((s) => `
                    <div class="set-chip">
                        <div>
                            <div>
                                <span class="day-tag-badge">${s.originalDay}</span>
                                <strong>${s.exName}:</strong> ${s.reps} reps @ ${s.weight}kg
                            </div>
                            <span class="advice-tag ${s.tagClass}">${s.tagText}</span>
                        </div>
                        <button class="btn-del-chip" onclick="removeSet('${item.id}', '${s.originalDay}', ${s.originalIdx})">✕</button>
                    </div>
                `).join('');

                const card = document.createElement('div');
                card.className = 'muscle-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="muscle-title">${item.name}</div>
                            <div class="target-info">Rango: ${item.minReps}-${item.maxReps} reps</div>
                        </div>
                        <div class="remaining-badge">Faltan ${Math.max(0, item.targetSeries - totalDoneWeek)} series</div>
                    </div>
                    <button class="accordion-trigger" onclick="toggleAccordion('${item.id}')">
                        <span>${allWeekSets.length} series registradas esta semana</span>
                        <span>${isOpen ? '▲ Ocultar' : '▼ Ver / Anotar'}</span>
                    </button>
                    <div class="accordion-content ${isOpen ? 'open' : ''}">
                        <div class="input-row">
                            <select id="select-${item.id}" class="select-ex" onchange="updateCoachAdvice('${item.id}')">${options}</select>
                            
                            <div class="smart-coach-box" id="coach-${item.id}"></div>

                            <div class="input-fields">
                                <input type="number" id="reps-${item.id}" placeholder="Reps">
                                <input type="number" id="weight-${item.id}" placeholder="Kg">
                            </div>
                            <button class="btn-add-set" onclick="addSet('${item.id}', ${item.minReps}, ${item.maxReps})">+ Anotar Serie para (${activeDay.toUpperCase()})</button>
                        </div>
                        <div style="margin-top: 6px;">${setsHTML}</div>
                    </div>
                `;
                container.appendChild(card);
                updateCoachAdvice(item.id);
            });

            const pct = Math.min(100, Math.round((grandTotalDone / grandTotalTarget) * 100));
            document.getElementById('total-summary').innerText = `${grandTotalDone} / ${grandTotalTarget} Series`;
            document.getElementById('total-progress-bar').style.width = pct + '%';
        }

        window.onload = initApp;
    </script>
</body>
</html>
