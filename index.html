<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Track Pro - AI Powered</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151c2c;
            --primary: #6366f1;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #26334d;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            padding-bottom: 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .btn-reset-week {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .ai-config-card {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 16px;
        }

        .ai-config-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: #a5b4fc;
            margin-bottom: 6px;
        }

        .ai-input-group {
            display: flex;
            gap: 6px;
        }

        .ai-key-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
        }

        .btn-ai {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-ai-consult {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 800;
            font-size: 0.82rem;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .ai-response-box {
            display: none;
            background: var(--bg);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.78rem;
            line-height: 1.4;
            color: #e2e8f0;
            white-space: pre-line;
        }

        .day-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .day-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 4px;
            font-weight: 700;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .day-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .muscle-cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .muscle-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .muscle-title {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .target-info {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .remaining-badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #a5b4fc;
        }

        .accordion-trigger {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            width: 100%;
            cursor: pointer;
        }

        .accordion-content {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .accordion-content.open {
            display: flex;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg);
            padding: 10px;
            border-radius: 8px;
        }

        .select-ex, .input-fields input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        .input-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .btn-add-set {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .set-chip {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .btn-del-chip {
            background: transparent;
            border: none;
            color: var(--danger);
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">GYM TRACK PRO</div>
        <button class="btn-reset-week" onclick="resetWeek()">🔄 Reiniciar Semana</button>
    </header>

    <div class="summary-card">
        <div class="summary-header">
            <span>PROGRESO SEMANAL</span>
            <span id="total-summary">0 / 0 Series</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="total-progress-bar"></div>
        </div>
    </div>

    <div class="ai-config-card">
        <div class="ai-config-title">🤖 CONEXIÓN CON GEMINI IA</div>
        <div class="ai-input-group">
            <input type="text" id="gemini-key-input" class="ai-key-input" placeholder="Pega tu API Key (ej. AIzaSy...)">
            <button class="btn-ai" onclick="saveApiKey()">Guardar Key</button>
        </div>
        <button class="btn-ai-consult" onclick="consultGeminiAI()">✨ ANALIZAR MI RUTINA CON IA</button>
        <div id="ai-response" class="ai-response-box"></div>
    </div>

    <div class="day-selector">
        <button class="day-btn active" id="btn-lunes" onclick="setDay('lunes')">Lunes</button>
        <button class="day-btn" id="btn-miercoles" onclick="setDay('miercoles')">Miércoles</button>
        <button class="day-btn" id="btn-viernes" onclick="setDay('viernes')">Viernes</button>
    </div>

    <div class="muscle-cards-list" id="cards-container">Cargando...</div>

    <script>
        const initialConfig = [
            { id: 'pecho', name: 'PECHO', targetSeries: 12, minReps: 6, maxReps: 8, defaultExercises: ['Banco Plano', 'Inclinado con Mancuernas', 'Fondos', 'Aperturas'] },
            { id: 'espalda', name: 'ESPALDA', targetSeries: 15, minReps: 5, maxReps: 8, defaultExercises: ['Remo Bajo (Triángulo)', 'Remo en Máquina Inclinado', 'Remo Sentado', 'Jalón al Pecho'] },
            { id: 'hombros', name: 'HOMBROS', targetSeries: 9, minReps: 8, maxReps: 10, defaultExercises: ['Press Militar', 'Elevaciones Laterales', 'Pájaro'] },
            { id: 'biceps', name: 'BÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Curl Martillo', 'Curl Parado con Barra/Mancuerna', 'Curl Inclinado'] },
            { id: 'triceps', name: 'TRÍCEPS', targetSeries: 9, minReps: 8, maxReps: 12, defaultExercises: ['Press Francés', 'Extensión Polea con Cuerda', 'Extensión Copa'] },
            { id: 'cuadriceps', name: 'CUÁDRICEPS', targetSeries: 12, minReps: 5, maxReps: 8, defaultExercises: ['Sentadillas / Hack', 'Prensa de Piernas', 'Extensión de Cuádriceps'] },
            { id: 'isquios', name: 'ISQUIOS', targetSeries: 10, minReps: 6, maxReps: 10, defaultExercises: ['Peso Muerto Rumano', 'Curl Femoral Acostado'] },
            { id: 'abductores', name: 'ABDUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Abductores Máquina'] },
            { id: 'aductores', name: 'ADUCTORES', targetSeries: 4, minReps: 10, maxReps: 15, defaultExercises: ['Aductores Máquina'] },
            { id: 'pantorrillas', name: 'PANTORRILLAS', targetSeries: 9, minReps: 8, maxReps: 15, defaultExercises: ['Elevación Talones Sentado', 'Elevación Talones Parado'] }
        ];

        let activeDay = 'lunes';
        let store = {};
        let exerciseHistory = {};
        let openAccordions = {};
        let geminiApiKey = '';

        function initApp() {
            try {
                const savedStore = localStorage.getItem('gtp_store');
                const savedHistory = localStorage.getItem('gtp_history');
                const savedKey = localStorage.getItem('gtp_gemini_key');

                if (savedStore) store = JSON.parse(savedStore);
                if (savedHistory) exerciseHistory = JSON.parse(savedHistory);
                if (savedKey) {
                    geminiApiKey = savedKey;
                    document.getElementById('gemini-key-input').value = savedKey;
                }
            } catch(e) {
                store = {};
                exerciseHistory = {};
            }

            initialConfig.forEach(item => {
                if (!store[item.id] || typeof store[item.id] !== 'object') {
                    store[item.id] = { lunes: [], miercoles: [], viernes: [] };
                } else {
                    if (!Array.isArray(store[item.id].lunes)) store[item.id].lunes = [];
                    if (!Array.isArray(store[item.id].miercoles)) store[item.id].miercoles = [];
                    if (!Array.isArray(store[item.id].viernes)) store[item.id].viernes = [];
                }
            });

            render();
        }

        function saveData() {
            try {
                localStorage.setItem('gtp_store', JSON.stringify(store));
                localStorage.setItem('gtp_history', JSON.stringify(exerciseHistory));
            } catch(e) {}
        }

        function saveApiKey() {
            const key = document.getElementById('gemini-key-input').value.trim();
            if (key) {
                geminiApiKey = key;
                localStorage.setItem('gtp_gemini_key', key);
                alert('¡API Key guardada correctamente!');
            } else {
                alert('Por favor pega una API Key válida.');
            }
        }

        async function consultGeminiAI() {
            const currentKey = document.getElementById('gemini-key-input').value.trim() || geminiApiKey;
            if (!currentKey) {
                alert('Pega y presiona "Guardar Key" antes de consultar.');
                return;
            }

            geminiApiKey = currentKey;
            localStorage.setItem('gtp_gemini_key', currentKey);

            const box = document.getElementById('ai-response');
            box.style.display = 'block';
            box.innerText = '🤖 Conectando con Gemini IA...';

            const prompt = `Actúa como un entrenador personal experto en sobrecarga progresiva e hipertrofia.
Aquí está el historial de mi entrenamiento registrado en mi app:
${JSON.stringify(exerciseHistory, null, 2)}

Si no hay datos registrados todavía, dame un consejo general para arrancar con fuerza la semana.
Si hay datos, analiza mi progreso brevemente y responde:
1. Resumen de mi rendimiento.
2. Músculos o ejercicios con mejor avance.
3. Recomendaciones específicas para la próxima semana (pesos/reps).
Sé directo, motivador y breve para lectura en móvil.`;

            const models = ['gemini-1.5-flash', 'gemini-2.0-flash'];
            let lastErrorDetails = '';

            for (const model of models) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const data = await response.json();

                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                        box.innerText = data.candidates[0].content.parts[0].text;
                        return;
                    } else if (data.error) {
                        lastErrorDetails = data.error.message || JSON.stringify(data.error);
                    }
                } catch (e) {
                    lastErrorDetails = e.message || 'Error de conexión a internet';
                }
            }

            box.innerText = '❌ Error de respuesta de Gemini:\n' + lastErrorDetails + '\n\n💡 Sugerencia: Revisa que la clave empiece con "AIzaSy..." y no tenga espacios.';
        }

        function setDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + day).classList.add('active');
            render();
        }

        function toggleAccordion(id) {
            openAccordions[id] = !openAccordions[id];
            render();
        }

        function resetWeek() {
            if (confirm("¿Comenzar nueva semana? Se limpiarán las repeticiones registradas, pero tus registros de peso quedarán guardados.")) {
                initialConfig.forEach(item => {
                    if (store[item.id]) {
                        store[item.id].lunes = [];
                        store[item.id].miercoles = [];
                        store[item.id].viernes = [];
                    }
                });
                saveData();
                render();
            }
        }

        function addSet(muscleId, minReps, maxReps) {
            const select = document.getElementById('select-' + muscleId);
            const repsInput = document.getElementById('reps-' + muscleId);
            const weightInput = document.getElementById('weight-' + muscleId);

            const exName = select.value;
            const reps = parseInt(repsInput.value);
            const weight = parseFloat(weightInput.value) || 0;

            if (!reps) return alert('Ingresa las repeticiones logradas');

            const setObj = { exName, reps, weight, fecha: new Date().toLocaleDateString() };

            if (!store[muscleId]) store[muscleId] = { lunes: [], miercoles: [], viernes: [] };
            if (!store[muscleId][activeDay]) store[muscleId][activeDay] = [];

            store[muscleId][activeDay].push(setObj);

            if (!exerciseHistory[exName]) exerciseHistory[exName] = [];
            exerciseHistory[exName].push(setObj);

            repsInput.value = '';
            saveData();
            render();
        }

        function removeSet(muscleId, idx) {
            if (store[muscleId] && store[muscleId][activeDay]) {
                store[muscleId][activeDay].splice(idx, 1);
                saveData();
                render();
            }
        }

        function render() {
            try {
                const container = document.getElementById('cards-container');
                if (!container) return;
                container.innerHTML = '';

                let grandTotalDone = 0;
                let grandTotalTarget = 0;

                initialConfig.forEach(item => {
                    const muscleData = store[item.id] || { lunes: [], miercoles: [], viernes: [] };
                    const daySets = muscleData[activeDay] || [];
                    const totalDoneWeek = (muscleData.lunes ? muscleData.lunes.length : 0) + 
                                          (muscleData.miercoles ? muscleData.miercoles.length : 0) + 
                                          (muscleData.viernes ? muscleData.viernes.length : 0);
                    
                    grandTotalDone += totalDoneWeek;
                    grandTotalTarget += item.targetSeries;

                    const isOpen = !!openAccordions[item.id];
                    const options = item.defaultExercises.map(ex => `<option value="${ex}">${ex}</option>`).join('');

                    let setsHTML = daySets.map((s, idx) => `
                        <div class="set-chip">
                            <span><strong>${s.exName}:</strong> ${s.reps} reps @ ${s.weight}kg</span>
                            <button class="btn-del-chip" onclick="removeSet('${item.id}', ${idx})">✕</button>
                        </div>
                    `).join('');

                    const card = document.createElement('div');
                    card.className = 'muscle-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="muscle-title">${item.name}</div>
                                <div class="target-info">Rango: ${item.minReps}-${item.maxReps} reps</div>
                            </div>
                            <div class="remaining-badge">Faltan ${Math.max(0, item.targetSeries - totalDoneWeek
